# Configuracion del Servidor
server.port=${PORT:8080}

# Configuracion de Base de Datos (Gestionada dinámicamente por DatabaseConfig.java)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reactivando}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicialización de scripts SQL
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Configuracion JWT
app.jwt.secret=${JWT_SECRET:ReactivandoElFuturoSecretKeySena2026SuperSeguraConMasDe256Bits!}
app.jwt.expiration-ms=86400000

# Swagger / OpenAPI 3 Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Google Maps API Key
google.maps.api-key=${GOOGLE_MAPS_API_KEY:CLAVE_DE_PRUEBA_GOOGLE_MAPS}
