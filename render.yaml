services:
  # Backend Spring Boot Web Service
  - type: web
    name: reactivando-backend
    env: docker
    dockerfilePath: reactivando-backend/Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: reactivando
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        value: ReactivandoElFuturoSecretKeySena2026SuperSeguraConMasDe256Bits!

  # Frontend React Static Site
  - type: static
    name: reactivando-frontend
    rootDir: reactivando-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
